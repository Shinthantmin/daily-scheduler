<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Notes and tasks manager" />
    <title>Notes - Daily Schedule & Notes</title>
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/theme.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/pages.css" />
  </head>
  <body>
    <header class="header" role="banner">
      <div class="header-content">
        <div class="logo">
          <svg
            class="logo-icon"
            width="32"
            height="32"
            viewBox="0 0 32 32"
            aria-hidden="true"
          >
            <rect
              x="4"
              y="6"
              width="24"
              height="22"
              rx="2"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            />
            <line
              x1="4"
              y1="12"
              x2="28"
              y2="12"
              stroke="currentColor"
              stroke-width="2"
            />
            <circle cx="10" cy="18" r="1.5" fill="currentColor" />
            <circle cx="16" cy="18" r="1.5" fill="currentColor" />
            <circle cx="22" cy="18" r="1.5" fill="currentColor" />
          </svg>
          <h1 class="logo-text">Daily Planner</h1>
        </div>

        <nav class="main-nav" role="navigation" aria-label="Main navigation">
          <a href="index.html" class="nav-link">Dashboard</a>
          <a href="schedule.html" class="nav-link">Schedule</a>
          <a href="notes.html" class="nav-link active" aria-current="page"
            >Notes</a
          >
          <a href="settings.html" class="nav-link">Settings</a>
        </nav>

        <div class="header-actions">
          <button
            class="btn-icon"
            id="searchBtn"
            aria-label="Search"
            title="Search (Ctrl+K)"
          >
            <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
              <circle
                cx="8"
                cy="8"
                r="6"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              />
              <line
                x1="12.5"
                y1="12.5"
                x2="18"
                y2="18"
                stroke="currentColor"
                stroke-width="2"
              />
            </svg>
          </button>
          <button
            class="btn-icon"
            id="themeToggle"
            aria-label="Toggle theme"
            title="Toggle dark mode"
          >
            <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
              <circle cx="10" cy="10" r="5" fill="currentColor" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="main-content" role="main">
      <div class="notes-container">
        <!-- Sidebar -->
        <aside
          class="notes-sidebar"
          role="complementary"
          aria-label="Notes filters"
        >
          <div class="sidebar-section">
            <h3>View</h3>
            <div class="view-toggle" role="tablist" aria-label="Content type">
              <button
                class="toggle-btn active"
                role="tab"
                aria-selected="true"
                id="notesTabBtn"
              >
                Notes
              </button>
              <button
                class="toggle-btn"
                role="tab"
                aria-selected="false"
                id="tasksTabBtn"
              >
                Tasks
              </button>
            </div>
          </div>

          <div class="sidebar-section">
            <h3>Display</h3>
            <div class="display-toggle">
              <button
                class="btn-icon"
                id="gridViewBtn"
                aria-label="Grid view"
                title="Grid view"
              >
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 20 20"
                  aria-hidden="true"
                >
                  <rect x="2" y="2" width="7" height="7" fill="currentColor" />
                  <rect x="11" y="2" width="7" height="7" fill="currentColor" />
                  <rect x="2" y="11" width="7" height="7" fill="currentColor" />
                  <rect
                    x="11"
                    y="11"
                    width="7"
                    height="7"
                    fill="currentColor"
                  />
                </svg>
              </button>
              <button
                class="btn-icon active"
                id="listViewBtn"
                aria-label="List view"
                title="List view"
              >
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 20 20"
                  aria-hidden="true"
                >
                  <line
                    x1="2"
                    y1="5"
                    x2="18"
                    y2="5"
                    stroke="currentColor"
                    stroke-width="2"
                  />
                  <line
                    x1="2"
                    y1="10"
                    x2="18"
                    y2="10"
                    stroke="currentColor"
                    stroke-width="2"
                  />
                  <line
                    x1="2"
                    y1="15"
                    x2="18"
                    y2="15"
                    stroke="currentColor"
                    stroke-width="2"
                  />
                </svg>
              </button>
            </div>
          </div>

          <div class="sidebar-section">
            <h3>Filter</h3>
            <div class="filter-group">
              <label class="checkbox-label">
                <input type="checkbox" id="filterPinned" />
                <span>Pinned only</span>
              </label>
            </div>
          </div>

          <div class="sidebar-section">
            <h3>Tags</h3>
            <div id="tagsList" class="tags-list">
              <!-- Populated by JS -->
            </div>
          </div>
        </aside>

        <!-- Main Content -->
        <div class="notes-main">
          <div class="notes-header">
            <div class="search-bar">
              <svg
                width="20"
                height="20"
                viewBox="0 0 20 20"
                aria-hidden="true"
              >
                <circle
                  cx="8"
                  cy="8"
                  r="6"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />
                <line
                  x1="12.5"
                  y1="12.5"
                  x2="18"
                  y2="18"
                  stroke="currentColor"
                  stroke-width="2"
                />
              </svg>
              <input
                type="search"
                id="notesSearch"
                placeholder="Search notes and tasks..."
                aria-label="Search notes and tasks"
              />
            </div>
            <button class="btn btn-primary" id="addNoteBtn">
              <svg
                width="16"
                height="16"
                viewBox="0 0 16 16"
                aria-hidden="true"
              >
                <line
                  x1="8"
                  y1="3"
                  x2="8"
                  y2="13"
                  stroke="currentColor"
                  stroke-width="2"
                />
                <line
                  x1="3"
                  y1="8"
                  x2="13"
                  y2="8"
                  stroke="currentColor"
                  stroke-width="2"
                />
              </svg>
              New Note
            </button>
          </div>

          <!-- Notes Tab Content -->
          <div id="notesContent" class="tab-content">
            <div id="notesGrid" class="notes-grid list-view">
              <!-- Populated by JS -->
            </div>
          </div>

          <!-- Tasks Tab Content -->
          <div id="tasksContent" class="tab-content hidden">
            <div class="tasks-controls">
              <button class="btn btn-primary" id="addTaskBtn">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 16 16"
                  aria-hidden="true"
                >
                  <line
                    x1="8"
                    y1="3"
                    x2="8"
                    y2="13"
                    stroke="currentColor"
                    stroke-width="2"
                  />
                  <line
                    x1="3"
                    y1="8"
                    x2="13"
                    y2="8"
                    stroke="currentColor"
                    stroke-width="2"
                  />
                </svg>
                Add Task
              </button>
            </div>
            <div id="tasksList" class="tasks-list">
              <!-- Populated by JS -->
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer" role="contentinfo">
      <p>
        Daily Schedule & Notes v1.0.0 |
        <a href="#help" class="footer-link">Help</a>
      </p>
    </footer>

    <nav class="mobile-nav" role="navigation" aria-label="Mobile navigation">
      <a href="index.html" class="mobile-nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          />
        </svg>
        <span>Home</span>
      </a>
      <a href="schedule.html" class="mobile-nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <rect
            x="3"
            y="4"
            width="18"
            height="18"
            rx="2"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          />
          <line
            x1="3"
            y1="10"
            x2="21"
            y2="10"
            stroke="currentColor"
            stroke-width="2"
          />
        </svg>
        <span>Schedule</span>
      </a>
      <a href="notes.html" class="mobile-nav-item active" aria-current="page">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          />
          <polyline
            points="14,2 14,8 20,8"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          />
        </svg>
        <span>Notes</span>
      </a>
      <a href="settings.html" class="mobile-nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <circle
            cx="12"
            cy="12"
            r="3"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          />
          <path
            d="M12 1v6m0 6v10M1 12h6m6 0h10"
            stroke="currentColor"
            stroke-width="2"
          />
        </svg>
        <span>Settings</span>
      </a>
    </nav>

    <div
      id="toastContainer"
      class="toast-container"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>
    <div id="modalContainer"></div>

    <script type="module" src="assets/js/main.js"></script>
  </body>
</html>
