<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Schedule planner with daily and weekly views"
    />
    <title>Schedule - Daily Schedule & Notes</title>
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/theme.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/pages.css" />
  </head>
  <body>
    <header class="header" role="banner">
      <div class="header-content">
        <div class="logo">
          <svg
            class="logo-icon"
            width="32"
            height="32"
            viewBox="0 0 32 32"
            aria-hidden="true"
          >
            <rect
              x="4"
              y="6"
              width="24"
              height="22"
              rx="2"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            />
            <line
              x1="4"
              y1="12"
              x2="28"
              y2="12"
              stroke="currentColor"
              stroke-width="2"
            />
            <circle cx="10" cy="18" r="1.5" fill="currentColor" />
            <circle cx="16" cy="18" r="1.5" fill="currentColor" />
            <circle cx="22" cy="18" r="1.5" fill="currentColor" />
          </svg>
          <h1 class="logo-text">Daily Planner</h1>
        </div>

        <nav class="main-nav" role="navigation" aria-label="Main navigation">
          <a href="index.html" class="nav-link">Dashboard</a>
          <a href="schedule.html" class="nav-link active" aria-current="page"
            >Schedule</a
          >
          <a href="notes.html" class="nav-link">Notes</a>
          <a href="settings.html" class="nav-link">Settings</a>
        </nav>

        <div class="header-actions">
          <button
            class="btn-icon"
            id="searchBtn"
            aria-label="Search"
            title="Search (Ctrl+K)"
          >
            <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
              <circle
                cx="8"
                cy="8"
                r="6"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              />
              <line
                x1="12.5"
                y1="12.5"
                x2="18"
                y2="18"
                stroke="currentColor"
                stroke-width="2"
              />
            </svg>
          </button>
          <button
            class="btn-icon"
            id="themeToggle"
            aria-label="Toggle theme"
            title="Toggle dark mode"
          >
            <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
              <circle cx="10" cy="10" r="5" fill="currentColor" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="main-content" role="main">
      <div class="schedule-container">
        <!-- Schedule Controls -->
        <div class="schedule-controls">
          <div class="view-toggle" role="tablist" aria-label="Calendar view">
            <button
              class="toggle-btn active"
              role="tab"
              aria-selected="true"
              aria-controls="dayView"
              id="dayViewBtn"
            >
              Day
            </button>
            <button
              class="toggle-btn"
              role="tab"
              aria-selected="false"
              aria-controls="weekView"
              id="weekViewBtn"
            >
              Week
            </button>
          </div>

          <div class="date-navigation">
            <button
              class="btn-icon"
              id="prevPeriod"
              aria-label="Previous period"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 20 20"
                aria-hidden="true"
              >
                <polyline
                  points="12,4 6,10 12,16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />
              </svg>
            </button>
            <h2 id="currentPeriod" class="current-period">Today</h2>
            <button class="btn-icon" id="nextPeriod" aria-label="Next period">
              <svg
                width="20"
                height="20"
                viewBox="0 0 20 20"
                aria-hidden="true"
              >
                <polyline
                  points="8,4 14,10 8,16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />
              </svg>
            </button>
            <button class="btn btn-secondary" id="todayBtn">Today</button>
          </div>

          <button class="btn btn-primary" id="addEventBtn">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
              <line
                x1="8"
                y1="3"
                x2="8"
                y2="13"
                stroke="currentColor"
                stroke-width="2"
              />
              <line
                x1="3"
                y1="8"
                x2="13"
                y2="8"
                stroke="currentColor"
                stroke-width="2"
              />
            </svg>
            New Event
          </button>
        </div>

        <!-- Day View -->
        <div
          id="dayView"
          class="calendar-view day-view"
          role="tabpanel"
          aria-labelledby="dayViewBtn"
        >
          <div class="time-grid" id="timeGrid">
            <!-- Populated by JS -->
          </div>
        </div>

        <!-- Week View -->
        <div
          id="weekView"
          class="calendar-view week-view hidden"
          role="tabpanel"
          aria-labelledby="weekViewBtn"
        >
          <div class="week-grid" id="weekGrid">
            <!-- Populated by JS -->
          </div>
        </div>
      </div>
    </main>

    <footer class="footer" role="contentinfo">
      <p>
        Daily Schedule & Notes v1.0.0 |
        <a href="#help" class="footer-link">Help</a>
      </p>
    </footer>

    <nav class="mobile-nav" role="navigation" aria-label="Mobile navigation">
      <a href="index.html" class="mobile-nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          />
        </svg>
        <span>Home</span>
      </a>
      <a
        href="schedule.html"
        class="mobile-nav-item active"
        aria-current="page"
      >
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <rect
            x="3"
            y="4"
            width="18"
            height="18"
            rx="2"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          />
          <line
            x1="3"
            y1="10"
            x2="21"
            y2="10"
            stroke="currentColor"
            stroke-width="2"
          />
        </svg>
        <span>Schedule</span>
      </a>
      <a href="notes.html" class="mobile-nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          />
          <polyline
            points="14,2 14,8 20,8"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          />
        </svg>
        <span>Notes</span>
      </a>
      <a href="settings.html" class="mobile-nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <circle
            cx="12"
            cy="12"
            r="3"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          />
          <path
            d="M12 1v6m0 6v10M1 12h6m6 0h10"
            stroke="currentColor"
            stroke-width="2"
          />
        </svg>
        <span>Settings</span>
      </a>
    </nav>

    <div
      id="toastContainer"
      class="toast-container"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>
    <div id="modalContainer"></div>

    <script type="module" src="assets/js/main.js"></script>
  </body>
</html>
