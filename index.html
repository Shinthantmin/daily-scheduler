<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Daily Schedule & Notes - Your personal organizer"
    />
    <title>Dashboard - Daily Schedule & Notes</title>
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/theme.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/pages.css" />
  </head>
  <body>
    <!--
    DAILY SCHEDULE & NOTES v1.0.0
    
    FEATURES:
    - Multi-page personal organizer with events, notes, and tasks
    - Fully offline with localStorage persistence
    - Responsive design (mobile-first, 360px to desktop)
    - WCAG 2.1 AA accessibility compliance
    - Keyboard navigation (Tab, Shift+Tab, Enter, Esc, Arrow keys)
    
    KEYBOARD SHORTCUTS:
    - Ctrl/Cmd + K: Global search
    - Ctrl/Cmd + N: New event/note (contextual)
    - Esc: Close modal/dialog
    - Tab/Shift+Tab: Navigate elements
    - Arrow keys: Navigate calendar days/weeks
    - Space: Toggle checkboxes
    - Enter: Confirm/submit forms
  -->

    <!-- Header with Navigation -->
    <header class="header" role="banner">
      <div class="header-content">
        <div class="logo">
          <svg
            class="logo-icon"
            width="32"
            height="32"
            viewBox="0 0 32 32"
            aria-hidden="true"
          >
            <rect
              x="4"
              y="6"
              width="24"
              height="22"
              rx="2"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            />
            <line
              x1="4"
              y1="12"
              x2="28"
              y2="12"
              stroke="currentColor"
              stroke-width="2"
            />
            <circle cx="10" cy="18" r="1.5" fill="currentColor" />
            <circle cx="16" cy="18" r="1.5" fill="currentColor" />
            <circle cx="22" cy="18" r="1.5" fill="currentColor" />
          </svg>
          <h1 class="logo-text">Daily Planner</h1>
        </div>

        <nav class="main-nav" role="navigation" aria-label="Main navigation">
          <a href="index.html" class="nav-link active" aria-current="page"
            >Dashboard</a
          >
          <a href="schedule.html" class="nav-link">Schedule</a>
          <a href="notes.html" class="nav-link">Notes</a>
          <a href="settings.html" class="nav-link">Settings</a>
        </nav>

        <div class="header-actions">
          <button
            class="btn-icon"
            id="searchBtn"
            aria-label="Search"
            title="Search (Ctrl+K)"
          >
            <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
              <circle
                cx="8"
                cy="8"
                r="6"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              />
              <line
                x1="12.5"
                y1="12.5"
                x2="18"
                y2="18"
                stroke="currentColor"
                stroke-width="2"
              />
            </svg>
          </button>
          <button
            class="btn-icon"
            id="themeToggle"
            aria-label="Toggle theme"
            title="Toggle dark mode"
          >
            <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
              <circle cx="10" cy="10" r="5" fill="currentColor" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content" role="main">
      <div class="dashboard-container">
        <!-- Today's Summary -->
        <section class="dashboard-section" aria-labelledby="today-heading">
          <div class="section-header">
            <h2 id="today-heading">Today</h2>
            <p class="today-date" id="todayDate"></p>
          </div>
          <div class="today-summary" id="todaySummary">
            <!-- Populated by JS -->
          </div>
        </section>

        <!-- Quick Add Section -->
        <section
          class="dashboard-section quick-add-section"
          aria-labelledby="quick-add-heading"
        >
          <h2 id="quick-add-heading" class="sr-only">Quick add</h2>
          <div class="quick-add-buttons">
            <button class="btn btn-primary" id="quickAddEvent">
              <svg
                width="16"
                height="16"
                viewBox="0 0 16 16"
                aria-hidden="true"
              >
                <line
                  x1="8"
                  y1="3"
                  x2="8"
                  y2="13"
                  stroke="currentColor"
                  stroke-width="2"
                />
                <line
                  x1="3"
                  y1="8"
                  x2="13"
                  y2="8"
                  stroke="currentColor"
                  stroke-width="2"
                />
              </svg>
              Add Event
            </button>
            <button class="btn btn-secondary" id="quickAddNote">
              <svg
                width="16"
                height="16"
                viewBox="0 0 16 16"
                aria-hidden="true"
              >
                <rect
                  x="3"
                  y="3"
                  width="10"
                  height="10"
                  rx="1"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />
              </svg>
              Add Note
            </button>
            <button class="btn btn-secondary" id="quickAddTask">
              <svg
                width="16"
                height="16"
                viewBox="0 0 16 16"
                aria-hidden="true"
              >
                <polyline
                  points="4,8 7,11 12,5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />
              </svg>
              Add Task
            </button>
          </div>
        </section>

        <!-- Mini Calendar -->
        <section class="dashboard-section" aria-labelledby="calendar-heading">
          <h2 id="calendar-heading">Calendar</h2>
          <div class="mini-calendar" id="miniCalendar">
            <!-- Populated by JS -->
          </div>
        </section>

        <!-- Upcoming Events -->
        <section class="dashboard-section" aria-labelledby="upcoming-heading">
          <div class="section-header">
            <h2 id="upcoming-heading">Upcoming</h2>
            <a href="schedule.html" class="link-text">View all</a>
          </div>
          <div class="upcoming-list" id="upcomingList">
            <!-- Populated by JS -->
          </div>
        </section>

        <!-- Tasks Overview -->
        <section class="dashboard-section" aria-labelledby="tasks-heading">
          <div class="section-header">
            <h2 id="tasks-heading">Tasks</h2>
            <a href="notes.html?tab=tasks" class="link-text">View all</a>
          </div>
          <div class="tasks-preview" id="tasksPreview">
            <!-- Populated by JS -->
          </div>
        </section>

        <!-- Recent Notes -->
        <section class="dashboard-section" aria-labelledby="notes-heading">
          <div class="section-header">
            <h2 id="notes-heading">Recent Notes</h2>
            <a href="notes.html" class="link-text">View all</a>
          </div>
          <div class="notes-preview" id="notesPreview">
            <!-- Populated by JS -->
          </div>
        </section>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer" role="contentinfo">
      <p>
        Daily Schedule & Notes v1.0.0 |
        <a href="#help" class="footer-link">Help</a>
      </p>
    </footer>

    <!-- Mobile Bottom Nav -->
    <nav class="mobile-nav" role="navigation" aria-label="Mobile navigation">
      <a href="index.html" class="mobile-nav-item active" aria-current="page">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          />
        </svg>
        <span>Home</span>
      </a>
      <a href="schedule.html" class="mobile-nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <rect
            x="3"
            y="4"
            width="18"
            height="18"
            rx="2"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          />
          <line
            x1="3"
            y1="10"
            x2="21"
            y2="10"
            stroke="currentColor"
            stroke-width="2"
          />
        </svg>
        <span>Schedule</span>
      </a>
      <a href="notes.html" class="mobile-nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          />
          <polyline
            points="14,2 14,8 20,8"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          />
        </svg>
        <span>Notes</span>
      </a>
      <a href="settings.html" class="mobile-nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <circle
            cx="12"
            cy="12"
            r="3"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          />
          <path
            d="M12 1v6m0 6v10M1 12h6m6 0h10"
            stroke="currentColor"
            stroke-width="2"
          />
        </svg>
        <span>Settings</span>
      </a>
    </nav>

    <!-- Toast Container -->
    <div
      id="toastContainer"
      class="toast-container"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>

    <!-- Modal Container -->
    <div id="modalContainer"></div>

    <!-- Scripts -->
    <script type="module" src="assets/js/main.js"></script>
  </body>
</html>
